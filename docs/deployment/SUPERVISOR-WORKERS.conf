# ==============================================================================
# MondolShopBD — Production Supervisor Queue & Outbox Worker Configuration
# Location: /etc/supervisor/conf.d/mondolshopbd-workers.conf
# ==============================================================================

# 1. Main Queue Worker (High priority: critical > normal > slow)
[program:mondolshopbd-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mondolshopbd/artisan queue:work redis --queue=critical,normal,slow --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mondolshopbd-queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600

# 2. Transactional Outbox Publisher Daemon
[program:mondolshopbd-outbox-worker]
process_name=%(program_name)s
command=php /var/www/mondolshopbd/artisan outbox:publish --daemon --interval=5
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mondolshopbd-outbox.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

# 3. Scheduled Tasks Runner (Alternative to Cron, using schedule:work)
[program:mondolshopbd-schedule-worker]
process_name=%(program_name)s
command=php /var/www/mondolshopbd/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mondolshopbd-schedule.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
